name: Sync Instagram feed

on:
  schedule:
    # 6시간마다 (UTC 기준). Feedframer 무료 플랜은 하루 1회 갱신이라 이 정도면 충분합니다.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write # 받아온 게시물을 커밋
  actions: write # 바뀐 게 있으면 배포 워크플로를 실행

# 동기화가 겹쳐 돌지 않도록 하나씩 처리합니다.
concurrency:
  group: sync-instagram
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 인스타 게시물 받아오기
        env:
          FEEDFRAMER_API_KEY: ${{ secrets.FEEDFRAMER_API_KEY }}
        run: node scripts/sync-instagram.mjs

      - name: 바뀐 게시물 커밋
        id: commit
        run: |
          git add -A -- data/instagram.json assets/img/instagram
          if git diff --cached --quiet; then
            echo "바뀐 게시물이 없어 커밋하지 않습니다."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # CLAUDE.md 의 커밋 규칙: 작성자는 저장소 소유자.
          # rebase 로 커밋을 다시 쌓을 때도 필요하므로 commit 에만 붙이지 않고 설정합니다.
          git config user.name "gonewroad"
          git config user.email "293277552+gonewroad@users.noreply.github.com"
          git commit -m "Sync Instagram feed"
          # 그사이 다른 커밋이 올라왔을 수 있어 최신으로 맞춘 뒤 올립니다.
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # 워크플로가 올린 커밋은 push 트리거를 깨우지 않으므로 배포를 직접 실행합니다.
      - name: 사이트 다시 배포
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
